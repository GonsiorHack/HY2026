<!doctype html>
<html lang="pl" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				var saved = JSON.parse(localStorage.getItem('krakow-dostepny:ustawienia') || 'null');
				if (saved && saved.theme === 'light') document.documentElement.dataset.theme = 'light';
				if (saved && (saved.highContrast || saved.theme === 'contrast'))
					document.documentElement.dataset.contrast = 'high';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
